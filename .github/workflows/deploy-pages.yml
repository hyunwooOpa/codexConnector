name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - hardening-audit-2026-10-08
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check price selection and browser code
        run: |
          node --test scripts/select-lowest.test.mjs scripts/app.test.mjs shopping/scripts/select-lowest.test.mjs shopping/scripts/app.test.mjs
          node --check app.js
          node --check shopping/app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
