name: Hardening tests

on:
  push:
    branches:
      - hardening-audit-2026-10-08
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run full tracker tests
        run: |
          node --test scripts/select-lowest.test.mjs scripts/app.test.mjs shopping/scripts/select-lowest.test.mjs shopping/scripts/app.test.mjs
          node --check app.js
          node --check shopping/app.js
